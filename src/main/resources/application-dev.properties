# ============================================================
# DEVELOPMENT PROFILE - Using H2 In-Memory Database
# ============================================================
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

spring.application.name=NusaTech - Dikoding Muda Nusantara

# ============================================================
# DATABASE CONFIGURATION (H2 In-Memory)
# ============================================================
spring.datasource.url=jdbc:h2:mem:koding_muda_belajar;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Enable H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# MULTIPART / FILE UPLOAD CONFIGURATION
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.location=${java.io.tmpdir}

server.tomcat.max-swallow-size=-1
server.tomcat.max-parameter-count=-1
server.tomcat.max-http-form-post-size=-1

# ============================================================
# FILE STORAGE SETTINGS
# ============================================================
app.upload.dir=uploads
app.upload.thumbnails=thumbnails
app.upload.videos=videos
app.upload.documents=documents

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8080
server.servlet.session.timeout=600
server.tomcat.connection-timeout=600000

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.koding_muda_nusantara=DEBUG
logging.level.org.springframework.web.multipart=DEBUG

# ============================================================
# ERROR HANDLING CONFIGURATION
# ============================================================
server.error.whitelabel.enabled=false
